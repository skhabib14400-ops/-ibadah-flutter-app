name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Dummy google-services.json if missing
      run: |
        DUMMY_JSON='{
          "project_info": { "project_number": "1234567890", "project_id": "dummy-project", "storage_bucket": "dummy.appspot.com" },
          "client": [{
            "client_info": { "mobilesdk_app_id": "1:1234567890:android:1234567890", "android_client_info": { "package_name": "com.example.app" } },
            "oauth_client": [],
            "api_key": [{ "current_key": "dummy_key" }],
            "services": { "analytics_service": { "status": 1 } }
          }],
          "configuration_version": "1"
        }'
        
        find . -type d -name "app" | while read dir; do
          if [ ! -f "$dir/google-services.json" ]; then
            echo "$DUMMY_JSON" > "$dir/google-services.json"
            echo "Created dummy google-services.json in $dir"
          fi
        done

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        elif [ -f "./app/gradlew" ]; then
          chmod +x ./app/gradlew
          cd app && ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: "**/build/outputs/apk/debug/*.apk"
