name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'

    - name: Build APK Automatically
      run: |
        PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
        if [ -n "$PUBSPEC_PATH" ]; then
          DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found pubspec.yaml in: $DIR"
          cd "$DIR"
          flutter pub get
          flutter build apk --release
        else
          echo "Error: pubspec.yaml not found in repository!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: "**/build/app/outputs/flutter-apk/app-release.apk"
